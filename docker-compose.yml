version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smart-delivery-db
    restart: always
    environment:
      POSTGRES_DB: smart_delivery
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: