<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | Smart Delivery</title>

    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/categories.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="stylesheet" href="/css/profile/profile.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="profile-page">

<div th:replace="~{fragments/navbar :: header}"></div>
<div th:replace="~{fragments/categories :: categories}"></div>

<main class="profile-shell">
    <section class="profile-layout">
        <aside class="profile-summary">
            <span class="profile-kicker">
                <i class="fas fa-user-circle"></i>
                Account
            </span>
            <h1>My Profile</h1>
            <p>Keep your contact details current so checkout and delivery updates stay smooth.</p>

            <div class="profile-email-card">
                <i class="fas fa-envelope"></i>
                <div>
                    <span>Signed in as</span>
                    <strong th:text="${user.email}">you@example.com</strong>
                </div>
            </div>

            <a th:href="@{/addresses}" class="profile-secondary-action">
                <i class="fas fa-location-dot"></i>
                Manage Addresses
            </a>
        </aside>

        <section class="profile-card">
            <div class="profile-card-header">
                <span class="profile-kicker">Personal details</span>
                <h2>Update your information</h2>
            </div>

            <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

            <form th:action="@{/profile}" method="post" th:object="${profileRequest}" class="profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="profile-form-grid">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <div class="profile-input-control">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" th:field="*{firstName}" placeholder="Enter first name"/>
                        </div>
                        <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message"></div>
                    </div>

                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <div class="profile-input-control">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Enter last name"/>
                        </div>
                        <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message"></div>
                    </div>

                    <div class="input-group">
                        <label for="phoneNumber">Phone Number</label>
                        <div class="profile-input-control">
                            <i class="fas fa-phone"></i>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Enter phone number"/>
                        </div>
                        <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error-message"></div>
                        <div th:if="${phoneNumberError}" th:text="${phoneNumberError}" class="error-message"></div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="profile-input-control disabled">
                            <i class="fas fa-envelope"></i>
                            <input type="text" id="email" th:value="${user.email}" disabled/>
                        </div>
                        <small class="form-text">Email cannot be changed</small>
                    </div>
                </div>

                <div class="profile-form-actions">
                    <button type="submit">
                        <i class="fas fa-floppy-disk"></i>
                        Update Profile
                    </button>
                </div>
            </form>
        </section>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
