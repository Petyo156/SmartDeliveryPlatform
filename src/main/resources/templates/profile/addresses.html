<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Addresses | Smart Delivery</title>

    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="stylesheet" href="/css/profile/profile.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          rel="stylesheet">
</head>

<body class="auth-page">

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="auth-wrapper">
    <div class="auth-container profile-address-container">

        <h2>My Addresses</h2>

        <div th:if="${successMessage}"
             class="success-message"
             th:text="${successMessage}">
        </div>

        <div th:if="${errorMessage}"
             class="error-message"
             th:text="${errorMessage}">
        </div>

        <div class="address-list"
             th:if="${not #lists.isEmpty(addresses)}">

            <div th:each="address : ${addresses}"
                 class="address-item">

                <div class="address-content">
                    <p>
                        <strong th:text="${address.city}"></strong>
                    </p>

                    <p th:text="${address.street + ', ' + address.building}"></p>
                </div>

                <div th:if="${editAddressUUID != null && editAddressUUID == address.id}">

                    <form th:action="@{'/addresses/' + ${address.id} + '/edit'}"
                          method="post"
                          th:object="${addressRequest}">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="input-group">
                            <input type="text"
                                   th:field="*{city}"
                                   placeholder="City"/>
                        </div>

                        <div class="input-group">
                            <input type="text"
                                   th:field="*{street}"
                                   placeholder="Street"/>
                        </div>

                        <div class="input-group">
                            <input type="text"
                                   th:field="*{building}"
                                   placeholder="Building"/>
                        </div>

                        <div class="address-actions">
                            <button type="submit">
                                Save
                            </button>

                            <a th:href="@{/addresses}">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

                <div class="address-actions"
                     th:if="${editAddressUUID == null || editAddressUUID != address.id}">

                    <a th:href="@{/addresses(editAddressId=${address.id})}">
                        <i class="fas fa-edit"></i>
                        Edit
                    </a>

                    <form th:action="@{'/addresses/delete/' + ${address.id}}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button type="submit">
                            Delete
                        </button>
                    </form>

                </div>

            </div>

        </div>

        <div th:if="${#lists.isEmpty(addresses)}">
            <p>No addresses yet.</p>
        </div>

        <div class="add-address-section"
             th:if="${canAddMoreAddresses}">

            <h3>Add Address</h3>

            <form th:action="@{/addresses}"
                  method="post"
                  th:object="${addressRequest}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="input-group">
                    <input type="text"
                           th:field="*{city}"
                           placeholder="City"/>
                </div>

                <div class="input-group">
                    <input type="text"
                           th:field="*{street}"
                           placeholder="Street"/>
                </div>

                <div class="input-group">
                    <input type="text"
                           th:field="*{building}"
                           placeholder="Building"/>
                </div>

                <button type="submit">
                    Add Address
                </button>

            </form>

        </div>

        <div th:if="${!canAddMoreAddresses}">
            <p>You reached maximum limit of 5 addresses.</p>
        </div>

        <div class="profile-links">
            <a th:href="@{/profile}">
                <i class="fas fa-arrow-left"></i>
                Back to Profile
            </a>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
