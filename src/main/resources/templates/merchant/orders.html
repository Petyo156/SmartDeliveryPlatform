<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orders | Smart Delivery</title>

    <link rel="stylesheet" href="/css/order/orders.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: header}"></div>

<main class="orders-page">
    <section class="orders-header">
        <h1>Incoming Orders</h1>
        <p>Review orders placed for your merchant.</p>
    </section>

    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

    <section th:if="${orders == null || orders.isEmpty()}" class="orders-empty">
        <i class="fas fa-receipt"></i>
        <h2>No incoming orders</h2>
        <p>New customer orders will appear here.</p>
    </section>

    <section th:unless="${orders == null || orders.isEmpty()}" class="orders-list">
        <article th:each="order : ${orders}" class="order-card">
            <div class="order-card-header">
                <div>
                    <span class="order-number" th:text="${order.orderNumber}">ORD-000</span>
                    <h2 th:text="${order.clientName}">Customer</h2>
                </div>

                <span class="order-status"
                      th:classappend="${order.status}"
                      th:text="${order.status}">PENDING</span>
            </div>

            <div class="order-meta">
                <p>
                    <i class="fas fa-clock"></i>
                    <span th:text="${order.createdAt}">Created at</span>
                </p>
                <p>
                    <i class="fas fa-location-dot"></i>
                    <span th:text="${order.deliveryAddress}">Delivery address</span>
                </p>
                <p>
                    <i class="fas fa-store"></i>
                    <span th:text="${order.merchantAddress}">Merchant address</span>
                </p>
                <p>
                    <i class="fas fa-motorcycle"></i>
                    <span th:text="${order.courierName}">Courier</span>
                    <span th:if="${order.courierAssigned}" th:text="${'(' + order.courierEmail + ')'}">courier@example.com</span>
                </p>
            </div>

            <div class="order-items">
                <div th:each="item : ${order.items}" class="order-item">
                    <div class="order-item-image">
                        <img th:if="${item.productImageUrl != null && !item.productImageUrl.isBlank()}"
                             th:src="${item.productImageUrl}"
                             th:alt="${item.productName}"
                             onerror="this.style.display='none'">
                        <div th:unless="${item.productImageUrl != null && !item.productImageUrl.isBlank()}"
                             class="order-item-placeholder">
                            <i class="fas fa-box-open"></i>
                        </div>
                    </div>

                    <div class="order-item-info">
                        <strong th:text="${item.productName}">Product</strong>
                        <span>
                            <span th:text="${item.quantity}">1</span>
                            x
                            <span th:text="${item.unitPrice}">0.00</span>
                            euro
                        </span>
                    </div>

                    <strong class="order-item-total">
                        <span th:text="${item.lineSubtotal}">0.00</span>
                        euro
                    </strong>
                </div>
            </div>

            <div class="order-total">
                <span>Total</span>
                <strong>
                    <span th:text="${order.totalPrice}">0.00</span>
                    euro
                </strong>
            </div>

            <a class="order-details-link"
               th:href="@{/dashboard/merchant/orders/{orderNumber}(orderNumber=${order.orderNumber})}">
                View details
            </a>

            <div class="order-actions"
                 th:if="${order.actions.canAcceptByMerchant || order.actions.canCancelByMerchant || order.actions.canMarkPreparingByMerchant || order.actions.canMarkPreparedByMerchant}">
                <form th:if="${order.actions.canAcceptByMerchant}"
                      th:action="@{/dashboard/merchant/orders/{orderNumber}/accept(orderNumber=${order.orderNumber})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">Accept</button>
                </form>

                <form th:if="${order.actions.canMarkPreparingByMerchant}"
                      th:action="@{/dashboard/merchant/orders/{orderNumber}/preparing(orderNumber=${order.orderNumber})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">Mark preparing</button>
                </form>

                <form th:if="${order.actions.canMarkPreparedByMerchant}"
                      th:action="@{/dashboard/merchant/orders/{orderNumber}/prepared(orderNumber=${order.orderNumber})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">Mark prepared</button>
                </form>

                <form th:if="${order.actions.canCancelByMerchant}"
                      th:action="@{/dashboard/merchant/orders/{orderNumber}/cancel(orderNumber=${order.orderNumber})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="order-action-danger">Cancel</button>
                </form>
            </div>
        </article>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
