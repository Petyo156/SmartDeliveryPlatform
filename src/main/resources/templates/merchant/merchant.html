<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Shop | Smart Delivery</title>

    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="auth-page">

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="auth-wrapper">
    <div class="auth-container">
        <h2>My Shop</h2>

        <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form th:action="@{/dashboard/merchant/my-shop}" method="post" th:object="${merchantProfileRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="input-group">
                <label for="name">Shop Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter shop name"/>
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></div>
            </div>

            <div class="input-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="Enter shop description" rows="4"></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-message"></div>
            </div>

            <div class="input-group">
                <label for="addressId">Address</label>
                <select id="addressId" th:field="*{addressId}">
                    <option value="">-- Select Address --</option>
                    <option th:each="addr : ${merchantAddressResponses}"
                            th:value="${addr.id}"
                            th:text="${addr.city + ', ' + addr.street + ', ' + addr.building}">
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('addressId')}" th:errors="*{addressId}" class="error-message"></div>
            </div>

            <div class="input-group">
                <label for="image-url">Image Url</label>
                <input type="text" id="image-url" th:field="*{imageUrl}" placeholder="Enter image url"/>
                <div th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" class="error-message"></div>
            </div>

            <button type="submit">Update Shop</button>

        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
