<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Smart Delivery</title>

    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="auth-page">

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="auth-wrapper">
    <div class="auth-container">
        <h2>Sign Up</h2>

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerRequest}">
            <div class="input-group">
                <input type="email" th:field="*{userRegisterRequest.email}" placeholder="Email" required/>
            </div>

            <div class="input-group">
                <input type="password" th:field="*{userRegisterRequest.password}" placeholder="Password" required/>
            </div>

            <div class="input-group">
                <input type="password" th:field="*{userRegisterRequest.confirmPassword}" placeholder="Confirm Password" required/>
            </div>

            <div class="input-group">
                <input type="text" th:field="*{userRegisterRequest.firstName}" placeholder="First Name" required/>
            </div>

            <div class="input-group">
                <input type="text" th:field="*{userRegisterRequest.lastName}" placeholder="Last Name" required/>
            </div>

            <div class="input-group">
                <input type="text" th:field="*{userRegisterRequest.phoneNumber}" placeholder="Phone Number"/>
            </div>

            <!-- ADDRESS -->
            <h3 class="section-title">Address (optional)</h3>

            <div class="input-group">
                <input type="text" th:field="*{addressRequest.city}" placeholder="City"/>
            </div>

            <div class="input-group">
                <input type="text" th:field="*{addressRequest.street}" placeholder="Street"/>
            </div>

            <div class="input-group">
                <input type="text" th:field="*{addressRequest.building}" placeholder="Building"/>
            </div>

            <button type="submit">Register</button>

            <p class="switch-link">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>

        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
