<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Smart Delivery</title>

    <link rel="stylesheet" href="/css/auth/auth.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="icon" href="/images/favicon.ico">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<div th:replace="~{fragments/navbar :: header}"></div>

<body class="auth-page">

<div class="auth-wrapper">
    <div class="auth-container">
        <h2>Sign Up</h2>

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="input-group">
                <input type="email" name="email" placeholder="Email" required/>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required/>
            </div>

            <div class="input-group">
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required/>
            </div>

            <div class="input-group">
                <input type="text" name="firstName" placeholder="First Name" required/>
            </div>

            <div class="input-group">
                <input type="text" name="lastName" placeholder="Last Name" required/>
            </div>

            <div class="input-group">
                <input type="text" name="phoneNumber" placeholder="Phone Number"/>
            </div>

            <h3 class="section-title">Address (optional)</h3>

            <div class="input-group">
                <input type="text" name="city" placeholder="City"/>
            </div>

            <div class="input-group">
                <input type="text" name="street" placeholder="Street"/>
            </div>

            <div class="input-group">
                <input type="text" name="building" placeholder="Building"/>
            </div>

            <div class="input-group">
                <input type="number" step="any" name="lat" placeholder="Latitude"/>
            </div>

            <div class="input-group">
                <input type="number" step="any" name="lng" placeholder="Longitude"/>
            </div>

            <button type="submit">Register</button>

            <p class="switch-link">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>

        </form>
    </div>
</div>

</body>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
