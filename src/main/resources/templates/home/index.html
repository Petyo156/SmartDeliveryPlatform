<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Smart Delivery</title>
    <link rel="stylesheet" href="/css/home/index.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/categories.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico">
</head>

<body>

<div th:replace="~{fragments/navbar :: header}"></div>
<div th:replace="~{fragments/categories :: categories}"></div>

<main class="home-container">

    <section class="hero">
        <form th:action="@{/search}" method="get" class="global-search-form">
            <input type="text" name="q" th:value="${param.q}" class="search-input" placeholder="Search for restaurants, shops, or products..."/>
            <button type="submit" class="search-btn">
                <i class="fas fa-search"></i> Search
            </button>
        </form>

        <div class="hero-buttons">
            <a th:href="@{/restaurants}" class="hero-btn">Browse Restaurants</a>
            <a th:href="@{/shops}" class="hero-btn hero-btn-secondary">Browse Shops</a>
        </div>
    </section>

    <section class="featured">
        <h2>Popular Restaurants 🔥</h2>
        <div class="merchant-grid"
             th:if="${restaurantMerchants != null && !restaurantMerchants.isEmpty()}">
            <div th:each="merchant : ${restaurantMerchants}">
                <div th:replace="~{fragments/merchant-card :: merchant-card(merchant=${merchant})}"></div>
            </div>
        </div>
        <div class="merchant-empty-state"
             th:if="${restaurantMerchants == null || restaurantMerchants.isEmpty()}">
            <i class="fas fa-utensils"></i>
            <h3>No restaurants available</h3>
        </div>

        <h2 class="section-spacing">Popular Shops 🛍️</h2>
        <div class="merchant-grid"
             th:if="${shopsMerchants != null && !shopsMerchants.isEmpty()}">
            <div th:each="merchant : ${shopsMerchants}">
                <div th:replace="~{fragments/merchant-card :: merchant-card(merchant=${merchant})}"></div>
            </div>
        </div>
        <div class="merchant-empty-state"
             th:if="${shopsMerchants == null || shopsMerchants.isEmpty()}">
            <i class="fas fa-store-slash"></i>
            <h3>No shops available</h3>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
