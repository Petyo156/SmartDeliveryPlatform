<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Search | Smart Delivery</title>
    <link rel="stylesheet" href="/css/home/merchant-browsing.css">
    <link rel="stylesheet" href="/css/home/search-results.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="stylesheet" href="/css/fragments/categories.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico">
</head>

<body>

<div th:replace="~{fragments/navbar :: header}"></div>
<div th:replace="~{fragments/categories :: categories}"></div>

<main class="search-page">
    <section class="search-hero search-hero-shops">
        <div class="search-hero-inner">
            <div class="search-copy">
                <span class="search-eyebrow">
                    <i class="fas fa-shopping-basket"></i>
                    Shop search
                </span>
                <h1>Search shops</h1>
                <p th:if="${searchResponse.hasQuery}">
                    Shop results for <strong th:text="${searchQuery}"></strong>.
                </p>
                <p th:unless="${searchResponse.hasQuery}">
                    Find groceries, electronics, flowers, and everyday goods.
                </p>
            </div>

            <div class="search-panel">
                <form th:action="@{/search/shops}" method="get" class="search-page-form" aria-label="Search shops">
                    <i class="fas fa-search"></i>
                    <input type="text" name="q" th:value="${param.q}" class="search-input" placeholder="Search shops or products..."/>
                    <button type="submit" class="search-btn">Search</button>
                </form>

                <nav class="search-tabs" aria-label="Search scopes">
                    <a th:href="@{/search(q=${searchQuery})}">All</a>
                    <a th:href="@{/search/restaurants(q=${searchQuery})}">Restaurants</a>
                    <a th:href="@{/search/shops(q=${searchQuery})}" class="active">Shops</a>
                </nav>
            </div>
        </div>
    </section>

    <section class="search-filter-pills">
        <div th:replace="~{fragments/category-pill :: category-pill(categories=${categoryPill}, selectedCategory=${selectedCategory}, baseUrl='/shops')}"></div>
    </section>

    <section class="search-results-shell">
        <section class="search-result-section" th:if="${searchResponse.hasMerchantMatches}">
            <div class="search-section-heading">
                <span class="search-eyebrow">
                    <i class="fas fa-store"></i>
                    Shop matches
                </span>
                <h2>Shops by search</h2>
            </div>
            <div class="search-results-grid">
                <div th:each="merchant : ${searchResponse.merchantMatches}">
                    <div th:replace="~{fragments/merchant-card :: merchant-card(merchant=${merchant})}"></div>
                </div>
            </div>
        </section>

        <section class="search-result-section" th:if="${searchResponse.hasProductMatches}">
            <div class="search-section-heading">
                <span class="search-eyebrow">
                    <i class="fas fa-box"></i>
                    Product matches
                </span>
                <h2>Shops that sell <span th:text="${searchQuery}"></span></h2>
            </div>
            <div class="search-results-grid">
                <div th:each="merchant : ${searchResponse.productMatches}">
                    <div th:replace="~{fragments/merchant-card :: merchant-card(merchant=${merchant})}"></div>
                </div>
            </div>
        </section>

        <div th:unless="${searchResponse.hasResults}" class="search-empty-state">
            <i class="fas fa-search"></i>
            <h2 th:if="${searchResponse.hasQuery}">No shop results found for "<span th:text="${searchQuery}"></span>"</h2>
            <h2 th:unless="${searchResponse.hasQuery}">Please enter a shop search query</h2>
            <p>Try searching by shop name or product.</p>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
