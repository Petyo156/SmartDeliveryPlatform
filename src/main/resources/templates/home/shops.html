<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shops | Smart Delivery</title>
    <link rel="stylesheet" href="/css/home/merchant-browsing.css">
    <link rel="stylesheet" href="/css/home/search-results.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/categories.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/images/favicon.ico">
</head>

<body>

<div th:replace="~{fragments/navbar :: header}"></div>
<div th:replace="~{fragments/categories :: categories}"></div>

<main class="search-page browse-page">
    <section class="search-hero search-hero-shops">
        <div class="search-hero-inner">
            <div class="search-copy">
                <span class="search-eyebrow">
                    <i class="fas fa-shopping-basket"></i>
                    Shop delivery
                </span>
                <h1>Browse shops</h1>
                <p>Find groceries, electronics, flowers, and everyday essentials from local shops.</p>
            </div>

            <div class="search-panel">
                <form th:action="@{/search/shops}" method="get" class="search-page-form" aria-label="Search shops">
                    <i class="fas fa-search"></i>
                    <input type="text" name="q" th:value="${param.q}" class="search-input" placeholder="Search shops and products..."/>
                    <button type="submit" class="search-btn">Search</button>
                </form>

                <nav class="search-tabs" aria-label="Browse sections">
                    <a th:href="@{/restaurants}">Restaurants</a>
                    <a th:href="@{/shops}" class="active">Shops</a>
                </nav>
            </div>
        </div>
    </section>

    <section class="search-filter-pills">
        <div th:replace="~{fragments/category-pill :: category-pill(categories=${categoryPill}, selectedCategory=${selectedCategory}, baseUrl='/shops')}"></div>
    </section>

    <section class="search-results-shell">
        <div class="search-filter-note" th:if="${selectedCategory != null}">
            <i class="fas fa-filter"></i>
            <p>
                Showing shops offering <strong th:text="${selectedCategory}"></strong>.
            </p>
        </div>

        <section class="search-result-section">
            <div class="search-section-heading">
                <span class="search-eyebrow">
                    <i class="fas fa-fire"></i>
                    Essentials nearby
                </span>
                <h2 th:if="${selectedCategory != null}">
                    Shops offering <span th:text="${selectedCategory}"></span>
                </h2>
                <h2 th:unless="${selectedCategory != null}">All shops</h2>
            </div>

            <div class="search-results-grid"
                 th:if="${merchantCardResponses != null && !merchantCardResponses.isEmpty()}">
                <div th:each="merchant : ${merchantCardResponses}">
                    <div th:replace="~{fragments/merchant-card :: merchant-card(merchant=${merchant})}"></div>
                </div>
            </div>

            <div th:if="${merchantCardResponses == null || merchantCardResponses.isEmpty()}" class="search-empty-state">
                <i class="fas fa-store-slash"></i>
                <h2>No shops available</h2>
                <p>Check back later for new shops.</p>
            </div>
        </section>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
