<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users | Smart Delivery</title>
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="icon" href="/images/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

<nav aria-label="Admin navigation">
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/admin/users" aria-current="page">Users</a></li>
        <li><a href="/admin/merchants">Merchants</a></li>
        <li><a href="/admin/couriers">Couriers</a></li>
        <li><a href="/admin/admins">Admins</a></li>
    </ul>
</nav>

<main>
    <h1>User Management</h1>

    <section aria-labelledby="search-heading">
        <h2 id="search-heading">Search Users</h2>

        <div role="status" th:if="${successMessage}">
            <p th:text="${successMessage}"></p>
        </div>

        <div role="alert" th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/admin/users}"
              th:object="${searchRequest}"
              method="get">
            <label for="searchEmail">Email:</label>
            <input type="text"
                   id="searchEmail"
                   th:field="*{searchEmail}"
                   placeholder="Enter user email"
                   autocomplete="email">
            <div th:if="${#fields.hasErrors('searchEmail')}"
                 th:errors="*{searchEmail}">
            </div>
            <button type="submit">Search</button>
        </form>
    </section>

    <section aria-labelledby="results-heading">
        <h2 id="results-heading">Search Results</h2>

        <div th:if="${userResponse.email != null}" role="region" aria-label="User information">
            <table>
                <caption>Details for user: <span th:text="${userResponse.email}"></span></caption>
                <thead>
                <tr>
                    <th scope="col">Email</th>
                    <th scope="col">First Name</th>
                    <th scope="col">Last Name</th>
                    <th scope="col">Phone</th>
                    <th scope="col">Role</th>
                    <th scope="col">Status</th>
                    <th scope="col">Created At</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td th:text="${userResponse.email}"></td>
                    <td th:text="${userResponse.firstName}"></td>
                    <td th:text="${userResponse.lastName}"></td>
                    <td th:text="${userResponse.phoneNumber}"></td>
                    <td th:text="${userResponse.role}"></td>
                    <td th:text="${userResponse.status}"></td>
                    <td th:text="${#temporals.format(userResponse.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form th:action="@{/admin/users/status}"
                              th:object="${userStatusRequest}"
                              method="post"
                              aria-label="Update user status">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" th:field="*{email}">
                            <label for="statusSelect">New Status:</label>
                            <select id="statusSelect" th:field="*{status}">
                                <option th:each="s : ${userStatuses}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>
                            </select>
                            <div th:if="${#fields.hasErrors('status')}"
                                 th:errors="*{status}">
                            </div>
                            <button type="submit">Update</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${!searchHasErrors and userResponse.email == null and searchRequest.searchEmail != null and !searchRequest.searchEmail.isBlank()}" role="status">
            <p>No user found with email: <strong th:text="${searchRequest.searchEmail}"></strong></p>
        </div>

        <div th:if="${searchRequest.searchEmail == null or searchRequest.searchEmail.isBlank()}" role="note">
            <p>Enter an email address and click Search to find a user.</p>
        </div>
    </section>

    <section aria-labelledby="back-link">
        <h2 id="back-link">Navigation</h2>
        <p><a href="/">Back to Home</a></p>
    </section>
</main>

</body>
</html>
