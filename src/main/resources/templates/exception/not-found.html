<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="/css/exception/not-found.css">
    <link rel="stylesheet" href="/css/fragments/navbar.css">
    <link rel="stylesheet" href="/css/fragments/footer.css">
    <link rel="stylesheet" href="/css/fragments/categories.css">
    <link rel="icon" href="/images/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: header}"></div>
<div th:replace="~{fragments/categories :: categories}"></div>

<main class="not-found-page">
    <section class="not-found-content">
        <div class="not-found-copy">
            <span class="not-found-code">
                <i class="fas fa-location-crosshairs"></i>
                404
            </span>
            <h1>Page not found</h1>
            <p>The page may have moved or no longer exists.</p>

            <div class="not-found-actions">
                <a th:href="@{/}" class="home-btn">
                    <i class="fas fa-house"></i>
                    Go Home
                </a>
                <a th:href="@{/restaurants}" class="browse-btn">
                    <i class="fas fa-utensils"></i>
                    Browse Restaurants
                </a>
                <a th:href="@{/shops}" class="browse-btn">
                    <i class="fas fa-shopping-basket"></i>
                    Browse Shops
                </a>
            </div>
        </div>

        <div class="not-found-image">
            <img src="/images/page_not_found.jpg" alt="Page not found">
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
